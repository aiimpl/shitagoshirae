<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 外に出ない設定。通信しないことを、書いたものだけでなく仕組みでも示す -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'none'; worker-src 'self' blob:; form-action 'none'; base-uri 'none'">
<title>したごしらえ</title>
<meta name="description" content="Xに上げる動画を、ブラウザの中だけで整える道具。アップロードしません。 / Get your video ready for X entirely inside your browser. Nothing is uploaded.">
<meta property="og:title" content="したごしらえ">
<meta property="og:description" content="Xに上げる動画を、ブラウザの中だけで整える。アップロードなし・登録なし・サーバーなし。">
<meta property="og:type" content="website">
<meta property="og:image" content="https://aiimpl.github.io/shitagoshirae/ogp.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#14171c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2314171c'/%3E%3Crect x='2' y='4' width='12' height='8' rx='1' fill='%234db6a0'/%3E%3Crect x='2' y='4' width='12' height='2' fill='%23223'/%3E%3Crect x='2' y='10' width='12' height='2' fill='%23223'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#14171c; --panel:#1c2027; --panel2:#232833; --line:#333a46;
  --ink:#eef1f5; --muted:#98a2b3; --accent:#4db6a0; --accent2:#3aa08a;
  --warn:#e8b94a; --danger:#e06c5a;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6}
body{padding:0 16px 64px;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}

header{max-width:1040px;margin:0 auto;padding:28px 0 16px;position:relative}
h1{margin:0;font-size:clamp(26px,4.4vw,38px);letter-spacing:.02em}
header p{margin:6px 0 0;color:var(--muted);font-size:15px}
.langbtn{position:absolute;top:28px;right:0;border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:13px;color:var(--muted)}
.langbtn:hover{color:var(--ink);border-color:var(--muted)}

main{max-width:1040px;margin:0 auto}
section{margin-top:18px}

/* ---- 入口 ---- */
.drop{border:2px dashed var(--line);border-radius:16px;padding:56px 20px;text-align:center;background:var(--panel);transition:border-color .15s,background .15s}
.drop.on{border-color:var(--accent);background:#1b2a28}
.drop .big{font-size:clamp(18px,3vw,24px);font-weight:700}
.drop .sub{color:var(--muted);margin-top:6px;font-size:14px}
.drop .note{color:var(--muted);font-size:13px;margin:18px 0 0}

/* ---- 作業画面 ---- */
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{margin:0 0 12px;font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.04em}

.pvwrap{background:#0e1115;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:220px}
#pv{max-width:100%;max-height:52vh;display:block}
.pvmeta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:10px}
.pvmeta b{color:var(--ink);font-weight:600}

.row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.row>label{width:96px;flex:none;color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{padding:7px 12px;font-size:13px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent);color:#0d1412;font-weight:700}
.seg button:disabled{opacity:.35;cursor:not-allowed}
input[type=number],input[type=text],input[type=time]{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:6px 8px;font:inherit;font-size:13px}
input[type=range]{accent-color:var(--accent);flex:1;min-width:120px}
.hint{color:var(--muted);font-size:12px;margin:-4px 0 12px}

/* ---- テロップ ---- */
.cue{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.cue .line{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.cue input[type=text]{flex:1;min-width:160px}
.cue .small{font-size:12px;color:var(--muted)}
.linkbtn{color:var(--accent);font-size:13px;text-decoration:underline}
.linkbtn.warn{color:var(--danger)}

/* ---- 注意書き ---- */
.warns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.warn{border-radius:10px;padding:10px 12px;font-size:13px;border:1px solid}
.warn.info{border-color:var(--line);background:var(--panel);color:var(--muted)}
.warn.warn{border-color:#5a4a20;background:#241f12;color:var(--warn)}
.warn.block{border-color:#5a2a24;background:#241412;color:var(--danger)}

/* ---- 進み具合・結果 ---- */
.actions{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.btn{border-radius:10px;padding:11px 20px;font-size:15px;border:1px solid var(--line);background:var(--panel2)}
.btn.primary{background:var(--accent);color:#0d1412;font-weight:700;border-color:transparent}
.btn.primary:hover{background:var(--accent2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.bar{height:10px;background:var(--panel2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.runinfo{display:flex;gap:16px;color:var(--muted);font-size:13px;margin-top:10px;flex-wrap:wrap}
.result video{width:100%;max-height:56vh;background:#000;border-radius:10px;display:block}
.big-ok{font-size:20px;font-weight:700;margin-bottom:6px}

footer{max-width:1040px;margin:36px auto 0;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>

<header>
  <button class="langbtn" id="bLang" data-t="btn.lang"></button>
  <h1 data-t="title"></h1>
  <p data-t="tagline"></p>
</header>

<main>
  <!-- 入口 -->
  <section id="drop" class="drop">
    <div class="big" data-t="drop.title"></div>
    <div class="sub" data-t="drop.sub"></div>
    <p class="note" data-t="drop.note"></p>
  </section>

  <!-- 設定 -->
  <section id="work" hidden>
    <div class="cols">
      <div class="card">
        <h2 data-t="out.preview"></h2>
        <div class="pvwrap"><canvas id="pv" width="16" height="9"></canvas></div>
        <div class="pvmeta" id="pvmeta"></div>
      </div>

      <div class="card">
        <h2 data-t="in.title"></h2>
        <div class="pvmeta" id="inmeta"></div>

        <h2 style="margin-top:18px" data-t="out.title"></h2>
        <div class="row">
          <label data-t="set.shape"></label>
          <div class="seg" id="segShape">
            <button data-v="keep" data-t="shape.keep"></button>
            <button data-v="16:9" data-t="shape.16:9"></button>
            <button data-v="1:1" data-t="shape.1:1"></button>
            <button data-v="9:16" data-t="shape.9:16"></button>
          </div>
        </div>
        <div class="row">
          <label data-t="set.pad"></label>
          <div class="seg" id="segPad">
            <button data-v="blur" data-t="pad.blur"></button>
            <button data-v="color" data-t="pad.color"></button>
            <button data-v="crop" data-t="pad.crop"></button>
          </div>
        </div>
        <div class="row">
          <label data-t="set.resolution"></label>
          <div class="seg" id="segRes">
            <button data-v="720p" data-t="res.720p"></button>
            <button data-v="1080p" data-t="res.1080p"></button>
            <button data-v="source" data-t="res.source"></button>
          </div>
        </div>

        <div class="row">
          <label data-t="set.trim"></label>
          <span class="small" id="trimLabel"></span>
        </div>
        <div class="row">
          <input type="range" id="trimIn" min="0" max="1000" value="0">
          <input type="range" id="trimOut" min="0" max="1000" value="1000">
        </div>

        <div class="row">
          <label data-t="set.size"></label>
          <div class="seg" id="segSizeMode">
            <button data-v="quality" data-t="size.quality"></button>
            <button data-v="size" data-t="size.size"></button>
          </div>
        </div>
        <div class="row" id="rowQuality">
          <label></label>
          <div class="seg" id="segQuality">
            <button data-v="low" data-t="quality.low"></button>
            <button data-v="medium" data-t="quality.medium"></button>
            <button data-v="high" data-t="quality.high"></button>
          </div>
        </div>
        <div class="row" id="rowTarget" hidden>
          <label data-t="set.target"></label>
          <input type="number" id="targetMb" min="1" max="512" step="1" value="30" style="width:88px"> MB
        </div>

        <div class="row">
          <label data-t="set.audio"></label>
          <div class="seg" id="segAudio">
            <button data-v="copy" data-t="audio.copy"></button>
            <button data-v="mute" data-t="audio.mute"></button>
          </div>
          <span class="small" id="audioNote"></span>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:18px">
      <h2 data-t="set.captions"></h2>
      <div id="cues"></div>
      <button class="linkbtn" id="bAddCue" data-t="cap.add"></button>
      <p class="hint" data-t="cap.note"></p>
    </div>

    <div class="warns" id="warns"></div>

    <div class="actions">
      <button class="btn primary" id="bConvert" data-t="btn.convert"></button>
      <span class="small" id="estimate"></span>
    </div>
  </section>

  <!-- 変換中 -->
  <section id="running" class="card" hidden>
    <h2 data-t="run.working"></h2>
    <div class="bar"><i id="barFill"></i></div>
    <div class="runinfo" id="runinfo"></div>
    <div class="actions"><button class="btn" id="bCancel" data-t="btn.cancel"></button></div>
  </section>

  <!-- 結果 -->
  <section id="result" class="card result" hidden>
    <div class="big-ok" id="resultTitle"></div>
    <div class="pvmeta" id="resultMeta" style="margin-bottom:12px"></div>
    <video id="resultVideo" controls playsinline></video>
    <div class="actions">
      <button class="btn primary" id="bSave" data-t="btn.save"></button>
      <button class="btn" id="bRedo" data-t="btn.redo"></button>
      <button class="btn" id="bAgain" data-t="btn.again"></button>
      <span class="small" id="saveNote"></span>
    </div>
  </section>

  <!-- しくじり -->
  <section id="error" class="card" hidden>
    <div class="big-ok" data-t="err.title"></div>
    <p id="errorBody" style="color:var(--muted)"></p>
    <div class="actions"><button class="btn" id="bErrBack" data-t="btn.again"></button></div>
  </section>
</main>

<footer>
  <p data-t="about.body"></p>
  <p><a href="https://github.com/aiimpl/shitagoshirae" data-t="about.repo"></a></p>
</footer>

<script type="module" src="src/main.js"></script>
</body>
</html>
