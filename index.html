<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 外に出ない設定。通信しないことを、書いたものだけでなく仕組みでも示す -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'none'; worker-src 'self' blob:; form-action 'none'; base-uri 'none'">
<title>したごしらえ</title>
<meta name="description" content="Xに上げる動画を、ブラウザの中だけで整える道具。アップロードしません。 / Get your video ready for X entirely inside your browser. Nothing is uploaded.">
<meta property="og:title" content="したごしらえ">
<meta property="og:description" content="Xに上げる動画を、ブラウザの中だけで整える。アップロードなし・登録なし・サーバーなし。">
<meta property="og:type" content="website">
<meta property="og:image" content="https://aiimpl.github.io/shitagoshirae/ogp.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#fff6ea">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ffc53d'/%3E%3Crect x='5' y='11' width='22' height='14' rx='3' fill='%23c98b4b'/%3E%3Crect x='5' y='11' width='22' height='3' rx='1.5' fill='%23e0a75f'/%3E%3Ccircle cx='12' cy='18' r='3' fill='%23ff5a45'/%3E%3Ccircle cx='20' cy='19' r='2.4' fill='%2314b88a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --paper:#fff6ea; --card:#fffdfa; --ink:#2b211a; --sub:#8a7a6a; --line:#eadcc9;
  --tomato:#ff5a45; --mint:#14b88a; --yolk:#ffc53d; --grape:#7a6cf0; --sky:#41a7e0;
  --shadow:0 4px 0 rgba(43,33,26,.10), 0 12px 24px rgba(43,33,26,.06);
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font-family:var(--sans);line-height:1.65;
  background:var(--paper);
  background-image:radial-gradient(rgba(43,33,26,.06) 1.4px, transparent 1.4px);
  background-size:22px 22px}
body{padding:0 16px 72px;-webkit-text-size-adjust:100%}
a{color:#0e8d69}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
h1,h2,h3{letter-spacing:.02em}

/* ---- 見出し ---- */
header{max-width:1080px;margin:0 auto;padding:26px 0 10px;position:relative;display:flex;align-items:center;gap:14px}
.mark{width:56px;height:56px;flex:none;border-radius:14px;background:var(--yolk);display:grid;place-items:center;box-shadow:var(--shadow)}
.mark svg{width:38px;height:38px}
h1{margin:0;font-size:clamp(28px,4.6vw,40px);font-weight:900}
header p{margin:2px 0 0;color:var(--sub);font-size:15px}
.langbtn{position:absolute;top:30px;right:0;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 16px;font-size:13px;font-weight:700;color:var(--sub)}
.langbtn:hover{border-color:var(--ink);color:var(--ink)}

@media (max-width:560px){
  header{padding-right:96px}
  header p{font-size:14px}
  .mark{width:46px;height:46px;border-radius:12px}
  .mark svg{width:31px;height:31px}
}
main{max-width:1080px;margin:0 auto}
section{margin-top:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.card h2{margin:0 0 14px;font-size:15px;font-weight:900;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--tomato)}
.card.mint h2::before{background:var(--mint)}
.card.grape h2::before{background:var(--grape)}
.card.sky h2::before{background:var(--sky)}

/* ---- 入口 ---- */
.drop{border:3px dashed var(--line);border-radius:24px;padding:60px 20px;text-align:center;background:var(--card);
  transition:border-color .15s,background .15s,transform .15s;box-shadow:var(--shadow)}
.drop:hover{border-color:var(--mint);transform:translateY(-2px)}
.drop.on{border-color:var(--mint);background:#effaf5}
.drop .emoji{font-size:44px;line-height:1}
.drop .big{font-size:clamp(20px,3.2vw,26px);font-weight:900;margin-top:8px}
.drop .sub{color:var(--sub);margin-top:4px;font-size:14px}
.drop .note{color:var(--sub);font-size:13px;margin:20px 0 0}

/* ---- 作業画面 ---- */
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.pvwrap{background:#f4ece0;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:230px;border:2px solid var(--line)}
#pv{max-width:100%;max-height:46vh;display:block}
.chips{display:flex;gap:8px 16px;flex-wrap:wrap;color:var(--sub);font-size:13px;margin-top:12px}
.chips b{color:var(--ink);font-weight:800}

.row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.row>label{width:88px;flex:none;color:var(--sub);font-size:13px;font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 14px;font-size:13px;font-weight:700;color:var(--sub);background:#f6efe4;border:2px solid transparent;border-radius:999px}
.seg button:hover{border-color:var(--line)}
.seg button.on{background:var(--tomato);color:#fff;box-shadow:0 3px 0 rgba(43,33,26,.15)}
.seg.mint button.on{background:var(--mint)}
.seg.grape button.on{background:var(--grape)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
input[type=number],input[type=text]{background:#fff;border:2px solid var(--line);border-radius:10px;color:var(--ink);padding:7px 10px;font:inherit;font-size:14px}
input[type=text]:focus,input[type=number]:focus{outline:none;border-color:var(--mint)}
.hint{color:var(--sub);font-size:12.5px;margin:0 0 10px}

/* ---- タイムライン ---- */
.tl{--h:64px;padding-top:26px}
.tl-strip{position:relative;height:var(--h);cursor:pointer;touch-action:none}
.tl-clip{position:absolute;inset:0;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:#efe6d8}
.tl-thumbs{width:100%;height:100%;display:block;object-fit:cover}
.tl-dim{position:absolute;top:0;bottom:0;background:rgba(43,33,26,.5)}
.tl-dim:first-of-type{left:0}
.tl-handle{position:absolute;top:-6px;height:calc(var(--h) + 12px);width:22px;margin-left:-11px;cursor:ew-resize;
  display:flex;align-items:center;justify-content:center;touch-action:none;z-index:3}
.tl-handle i{display:block;width:12px;height:100%;border-radius:7px;background:var(--yolk);border:2px solid var(--ink);
  box-shadow:0 2px 0 rgba(43,33,26,.2)}
.tl-handle::after{content:attr(data-time);position:absolute;top:-24px;font-size:11px;font-weight:800;
  background:var(--ink);color:#fff;border-radius:7px;padding:2px 7px;white-space:nowrap}
.tl-head{position:absolute;top:-6px;height:calc(var(--h) + 12px);width:3px;margin-left:-1.5px;background:var(--tomato);
  border-radius:2px;pointer-events:none;z-index:2;box-shadow:0 0 0 2px rgba(255,255,255,.75)}
.tl-lane{position:relative;height:40px;margin-top:10px;border-radius:12px;background:#f6efe4;border:2px dashed var(--line);touch-action:none}
.tl-cue{position:absolute;top:4px;bottom:4px;background:var(--c);border-radius:9px;color:#fff;font-size:12px;font-weight:800;
  display:flex;align-items:center;overflow:hidden;cursor:grab;box-shadow:0 2px 0 rgba(43,33,26,.18);min-width:22px}
.tl-cue.on{outline:3px solid var(--ink);outline-offset:1px}
.tl-cue span{padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.tl-cue i{width:9px;align-self:stretch;flex:none;cursor:ew-resize;background:rgba(255,255,255,.45)}
.tl-ticks{position:relative;height:18px;margin-top:4px;color:var(--sub);font-size:11px;font-weight:700}
.tl-ticks span{position:absolute;transform:translateX(-50%)}
.tl-ticks span:first-child{transform:none}
.tl-ticks span:last-child{transform:translateX(-100%)}

.cueedit{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:12px;border-radius:14px;background:#f6efe4}
.cueedit input[type=text]{flex:1;min-width:180px}
.cueedit .small{font-size:12px;color:var(--sub);font-weight:700}

/* ---- 注意書き ---- */
.warns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.warn{border-radius:14px;padding:11px 14px;font-size:13.5px;font-weight:700;border:2px solid}
.warn.info{border-color:var(--line);background:var(--card);color:var(--sub)}
.warn.warn{border-color:#f0c96a;background:#fff6e0;color:#9a6b12}
.warn.block{border-color:#f5a99d;background:#ffeeea;color:#c03a25}

/* ---- ボタン・進み具合・結果 ---- */
.actions{display:flex;gap:12px;align-items:center;margin-top:18px;flex-wrap:wrap}
.btn{border-radius:999px;padding:12px 24px;font-size:15px;font-weight:800;background:#f0e7da;border:2px solid var(--line)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--mint);color:#fff;border-color:transparent;box-shadow:0 4px 0 #0e8d69}
.btn.primary:hover{background:#12a97e;transform:translateY(1px);box-shadow:0 3px 0 #0e8d69}
.btn.primary:disabled{background:#cfd8d4;box-shadow:0 4px 0 #b6c0bb;cursor:not-allowed}
.btn.big{font-size:17px;padding:14px 32px}
.bar{height:16px;background:#f0e7da;border-radius:999px;overflow:hidden;border:2px solid var(--line)}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--yolk),var(--mint));transition:width .2s}
.runinfo{display:flex;gap:18px;color:var(--sub);font-size:13px;font-weight:700;margin-top:12px;flex-wrap:wrap}
.result video{width:100%;max-height:52vh;background:#000;border-radius:14px;display:block;border:2px solid var(--line)}
.big-ok{font-size:22px;font-weight:900;margin-bottom:8px;display:flex;align-items:center;gap:8px}

footer{max-width:1080px;margin:40px auto 0;color:var(--sub);font-size:13px;border-top:2px dashed var(--line);padding-top:18px}
footer b{color:var(--ink)}
</style>
</head>
<body>

<header>
  <button class="langbtn" id="bLang" data-t="btn.lang"></button>
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 32 32">
      <rect x="3" y="12" width="26" height="15" rx="3.5" fill="#c98b4b"/>
      <rect x="3" y="12" width="26" height="3.4" rx="1.7" fill="#e0a75f"/>
      <circle cx="11" cy="20" r="3.4" fill="#ff5a45"/>
      <circle cx="19.5" cy="21" r="2.6" fill="#14b88a"/>
      <rect x="21" y="3" width="2.6" height="9" rx="1.3" fill="#2b211a" transform="rotate(18 22 8)"/>
      <path d="M17 11 L25 4 L26.6 5.6 L19.6 12 Z" fill="#d7dde3" stroke="#2b211a" stroke-width="1.1" stroke-linejoin="round"/>
    </svg>
  </div>
  <div>
    <h1 data-t="title"></h1>
    <p data-t="tagline"></p>
  </div>
</header>

<main>
  <!-- 入口 -->
  <section id="drop" class="drop">
    <div class="emoji">🎬</div>
    <div class="big" data-t="drop.title"></div>
    <div class="sub" data-t="drop.sub"></div>
    <p class="note" data-t="drop.note"></p>
  </section>

  <!-- 設定 -->
  <section id="work" hidden>
    <div class="cols">
      <div class="card mint">
        <h2 data-t="out.preview"></h2>
        <div class="pvwrap"><canvas id="pv" width="16" height="9"></canvas></div>
        <div class="chips" id="pvmeta"></div>
      </div>

      <div class="card">
        <h2 data-t="in.title"></h2>
        <div class="chips" id="inmeta" style="margin-top:0"></div>

        <div class="row" style="margin-top:16px">
          <label data-t="set.shape"></label>
          <div class="seg" id="segShape">
            <button data-v="keep" data-t="shape.keep"></button>
            <button data-v="16:9" data-t="shape.16:9"></button>
            <button data-v="1:1" data-t="shape.1:1"></button>
            <button data-v="9:16" data-t="shape.9:16"></button>
          </div>
        </div>
        <div class="row">
          <label data-t="set.pad"></label>
          <div class="seg mint" id="segPad">
            <button data-v="blur" data-t="pad.blur"></button>
            <button data-v="color" data-t="pad.color"></button>
            <button data-v="crop" data-t="pad.crop"></button>
          </div>
        </div>
        <div class="row">
          <label data-t="set.resolution"></label>
          <div class="seg mint" id="segRes">
            <button data-v="720p" data-t="res.720p"></button>
            <button data-v="1080p" data-t="res.1080p"></button>
            <button data-v="source" data-t="res.source"></button>
          </div>
        </div>
        <div class="row">
          <label data-t="set.size"></label>
          <div class="seg grape" id="segSizeMode">
            <button data-v="quality" data-t="size.quality"></button>
            <button data-v="size" data-t="size.size"></button>
          </div>
        </div>
        <div class="row" id="rowQuality">
          <label></label>
          <div class="seg grape" id="segQuality">
            <button data-v="low" data-t="quality.low"></button>
            <button data-v="medium" data-t="quality.medium"></button>
            <button data-v="high" data-t="quality.high"></button>
          </div>
        </div>
        <div class="row" id="rowTarget" hidden>
          <label data-t="set.target"></label>
          <input type="number" id="targetMb" min="1" max="512" step="1" value="30" style="width:88px"> MB
        </div>
        <div class="row">
          <label data-t="set.fade"></label>
          <div class="seg" id="segFade">
            <button data-v="off" data-t="fade.off"></button>
            <button data-v="on" data-t="fade.on"></button>
          </div>
        </div>
        <div class="row">
          <label data-t="set.audio"></label>
          <div class="seg" id="segAudio">
            <button data-v="copy" data-t="audio.copy"></button>
            <button data-v="mute" data-t="audio.mute"></button>
          </div>
          <span class="small" id="audioNote" style="font-size:12.5px;color:var(--sub);font-weight:700"></span>
        </div>
      </div>
    </div>

    <!-- タイムライン -->
    <div class="card sky" style="margin-top:16px">
      <h2 data-t="tl.title"></h2>
      <p class="hint" data-t="tl.hint"></p>
      <div id="timeline"></div>
      <div class="actions" style="margin-top:14px">
        <button class="btn" id="bSplit" data-t="tl.split"></button>
        <button class="btn" id="bDropSeg" data-t="tl.drop"></button>
        <button class="btn" id="bAddCue" data-t="tl.newCue"></button>
        <span class="small" id="trimLabel" style="font-weight:800"></span>
      </div>
      <div class="cueedit" id="cueEdit"></div>
    </div>

    <div class="warns" id="warns"></div>

    <div class="actions">
      <button class="btn primary big" id="bConvert" data-t="btn.convert"></button>
      <span class="small" id="estimate" style="font-weight:800"></span>
    </div>
  </section>

  <!-- 変換中 -->
  <section id="running" class="card mint" hidden>
    <h2 data-t="run.working"></h2>
    <div class="bar"><i id="barFill"></i></div>
    <div class="runinfo" id="runinfo"></div>
    <div class="actions"><button class="btn" id="bCancel" data-t="btn.cancel"></button></div>
  </section>

  <!-- 結果 -->
  <section id="result" class="card mint result" hidden>
    <div class="big-ok"><span>🎉</span><span id="resultTitle"></span></div>
    <div class="chips" id="resultMeta" style="margin:0 0 12px"></div>
    <video id="resultVideo" controls playsinline></video>
    <div class="actions">
      <button class="btn primary big" id="bSave" data-t="btn.save"></button>
      <button class="btn" id="bRedo" data-t="btn.redo"></button>
      <button class="btn" id="bAgain" data-t="btn.again"></button>
      <span class="small" id="saveNote" style="font-weight:800;color:#0e8d69"></span>
    </div>
  </section>

  <!-- しくじり -->
  <section id="error" class="card" hidden>
    <div class="big-ok"><span>😵</span><span data-t="err.title"></span></div>
    <p id="errorBody" style="color:var(--sub);font-weight:700"></p>
    <div class="actions"><button class="btn" id="bErrBack" data-t="btn.again"></button></div>
  </section>
</main>

<footer>
  <p data-t="about.body"></p>
  <p><a href="https://github.com/aiimpl/shitagoshirae" data-t="about.repo"></a></p>
</footer>

<script type="module" src="src/main.js"></script>
</body>
</html>
