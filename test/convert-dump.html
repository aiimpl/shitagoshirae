<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>変換の確認（開発用）</title>
<style>
body { font-family: "Hiragino Sans", sans-serif; margin: 24px; max-width: 900px; }
pre { background: #f4f4f4; padding: 12px; border-radius: 8px; overflow: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>変換の確認（開発用）</h1>
<p>Chrome から <code>window.__convert(url, settings, saveName)</code> を呼んで使います。</p>
<pre id="out">待っています</pre>
<script type="module">
import { probeFile } from '../src/probe.js';
import { buildPlan } from '../src/plan.js';
import { startConversion, CancelledError } from '../src/convert.js';
import { buildCaptionTimeline, layoutCaptionSegment } from '../src/captions.js';
import { rasterizeBands, makeTextMeasurer } from '../src/caption-raster.js';

const out = document.getElementById('out');
const log = (s) => { out.textContent += '\n' + s; };

/** @type {(url: string, over: object, saveName: string) => Promise<object>} */
window.__convert = async (url, over, saveName) => {
  window.__done = null;
  out.textContent = `読み込み: ${url}`;
  const blob = await (await fetch(url)).blob();
  const file = new File([blob], url.split('/').pop(), { type: 'video/mp4' });
  const probe = await probeFile(file);
  const settings = {
    shape: 'keep', pad: 'blur', padColor: '#101418', blurStrength: 0.5, resolution: '1080p',
    segments: [{ id: 's0', startUs: 0, endUs: probe.durationUs }], fade: false, speed: 1, cropX: 0, cropY: 0,
    sizeMode: 'quality', targetBytes: 30 * 1024 * 1024,
    quality: 'high', maxFps: 60, audio: 'copy', cues: [], ...over,
  };
  const plan = buildPlan(probe, settings);
  log(`計画: ${plan.video.width}x${plan.video.height} ${(plan.video.bitrateBps / 1e6).toFixed(2)}Mbps 音声:${plan.audio.mode}`);
  if (plan.blocked) {
    throw new Error('止められました: ' + JSON.stringify(plan.warnings));
  }

  // テロップ（指定があれば絵にして渡す）
  let captions = [];
  if (settings.cues.length) {
    const measure = makeTextMeasurer();
    const segments = buildCaptionTimeline(settings.cues);
    const bands = segments.flatMap((seg) => layoutCaptionSegment(seg, {
      width: plan.video.width, height: plan.video.height, fontFamily: '"Hiragino Sans", sans-serif',
    }, measure));
    const raster = await rasterizeBands(bands);
    captions = raster.bitmaps;
    log(`テロップ: ${captions.length}枚`);
  }

  const t0 = performance.now();
  let lastProgress = null;
  const job = startConversion({
    file,
    plan,
    captions,
    onOpened: (info) => log(`開きました: ${info.codecString} ${info.width}x${info.height} 音声:${info.audio}`),
    onProgress: (p) => {
      lastProgress = p;
      // 指定があれば、途中で取り消して止まり方を見る
      if (window.__cancelAtRatio && p.ratio >= window.__cancelAtRatio) {
        window.__cancelAtRatio = 0;
        log(`${(p.ratio * 100).toFixed(0)}% で取り消します`);
        job.cancel();
      }
    },
  });
  let result;
  try {
    result = await job.done;
  } catch (err) {
    if (err instanceof CancelledError) {
      window.__done = { cancelled: true, lastProgress, elapsedMs: Math.round(performance.now() - t0) };
      log('取り消しました');
      return window.__done;
    }
    throw err;
  }
  const elapsed = performance.now() - t0;
  log(`終わりました: ${result.frames}枚 / ${(elapsed / 1000).toFixed(1)}秒`);

  let saved = null;
  if (saveName) {
    const res = await fetch('/__save/' + saveName, { method: 'POST', body: await result.blob.arrayBuffer() });
    saved = await res.json();
    log(`保存: ${saved.saved} (${(saved.bytes / 1024 / 1024).toFixed(1)}MB)`);
  }
  const summary = {
    probe: { ...probe, video: probe.video },
    plan: { width: plan.video.width, height: plan.video.height, bitrateBps: plan.video.bitrateBps, audio: plan.audio, trim: plan.trim },
    frames: result.frames,
    elapsedMs: Math.round(elapsed),
    durationUs: result.durationUs,
    cancelled: false,
    saved,
    lastProgress,
  };
  window.__done = summary;
  return summary;
};
</script>
</body>
</html>
